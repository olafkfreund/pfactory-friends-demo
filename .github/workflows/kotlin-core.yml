# Runs the kotlin-core lane's tests on every PR.
#
# Until this existed, nothing in this repository compiled a line of Kotlin. The
# build sandbox that authors these changes has no JVM, so an agent can only
# review its own code statically and say so; PR #35 was opened with code no
# machine had built. This is the gate that closes that.
name: kotlin-core

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: kotlin-core (gradle test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lanes/kotlin-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: gradle test --no-daemon

      # A green `gradle test` that executed fewer tests than the source contains
      # is indistinguishable from a full pass.  We count @Test annotations in
      # the source tree and compare them against the JUnit XML total so that a
      # test silently not running shows up as a mismatch rather than a pass.
      - name: Assert all tests ran
        if: always()
        run: |
          expected=$(grep -rh '@Test' src/test/kotlin/ | grep -c '@Test')
          shopt -s nullglob
          files=(build/test-results/test/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no JUnit XML produced - no tests ran"; exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "${files[@]}" | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "expected $expected test(s); executed $total across ${#files[@]} class(es)"
          if [ "${total:-0}" -ne "$expected" ]; then
            echo "::error::JUnit XML reports $total tests but $expected @Test methods exist in source — a test did not run"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-core-test-results
          path: lanes/kotlin-core/build/test-results/test/

  lint:
    name: kotlin-core (ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lanes/kotlin-core
    steps:
      - uses: actions/checkout@v4

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: Run ktlint
        run: ktlint 'src/**/*.kt'

  security-scan:
    name: kotlin-core (trivy dependency scan)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: lanes/kotlin-core
          severity: CRITICAL,HIGH
          exit-code: '1'

  containerise:
    name: kotlin-core (docker build & scan)
    runs-on: ubuntu-latest
    needs: [test, lint]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: lanes/kotlin-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble JAR
        run: gradle assemble --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load image
        uses: docker/build-push-action@v5
        with:
          context: lanes/kotlin-core
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/kotlin-core:${{ github.sha }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/kotlin-core:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Push image to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/${{ github.repository }}/kotlin-core:${{ github.sha }} \
            ghcr.io/${{ github.repository }}/kotlin-core:latest
          docker push ghcr.io/${{ github.repository }}/kotlin-core:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/kotlin-core:latest

  deploy:
    name: kotlin-core (deploy)
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan, containerise]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lanes/kotlin-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble release artifact
        run: gradle assemble --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-core-release
          path: lanes/kotlin-core/build/libs/
