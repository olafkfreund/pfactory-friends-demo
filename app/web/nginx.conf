server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API calls (see App.tsx API_BASE comment) proxy to the
    # api Service inside the cluster.
    location /healthz {
        proxy_pass http://myfriends-api:8000/healthz;
    }

    location /profiles/ {
        proxy_pass http://myfriends-api:8000/profiles/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
