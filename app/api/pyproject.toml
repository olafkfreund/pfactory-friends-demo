[project]
name = "myfriends-api"
version = "0.1.0"
description = "MyFriends API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Both of these are imported lazily inside functions, so their absence does
    # not fail at import time -- the pod starts healthy and dies on the first
    # request that touches the store or validates a token (demo#127). They are
    # runtime requirements and belong here.
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    # Used by _decode_token to fetch the JWKS. Also lazily imported, also
    # missing -- found only by deploying and watching the pod raise
    # ModuleNotFoundError on a real request. See
    # tests/test_lazy_imports_declared.py, which enumerates them so the next
    # one is caught by a test instead of by a 500.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
